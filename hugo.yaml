baseURL: https://fualsan.github.io/
locale: en-us
title: Non-Hype AI Topics (N-HAIT)
paginate: 5
theme: PaperMod
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: false
minify:
  disableXML: true
  minifyOutput: true


params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Non-Hype AI Topics (N-HAIT)
  description: "A scientific and technical blog about non-hype AI topics that fall outside the current trends."
  keywords: [Blog, Portfolio, PaperMod, Math, Science, AI]
  author: H. Fuat Alsan
  # author: ["Me", "You"] # multiple authors
  images: ["https://avatars.githubusercontent.com/u/13269656?v=4"]
  DateFormat: "January 2, 2006"
  defaultTheme: dark # dark, light
  disableThemeToggle: true

  ShowReadingTime: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowPageNums: true

  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    #disableHLJS: false # to disable highlight.js
    disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    #favicon: "<link / abs url>"
    #favicon16x16: "<link / abs url>"
    #favicon32x32: "<link / abs url>"
    #apple_touch_icon: "<link / abs url>"
    #safari_pinned_tab: "<link / abs url>"

  label:
    text: "Non-Hype AI Topics"
    #icon: /img/main_logo.png
    #iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    #title: Non-Hype AI Topics
    #subtitle: "Welcome to Non-Hype AI Topics (N-HAIT) blog!"
    #imageUrl: /img/avatar.jpg
    #imageWidth: 120
    #imageHeight: 120
    #imageTitle: hfuatalsan
    #buttons:
    #  - name: Posts
    #    url: posts
    #  - name: Tags
    #    url: tags

  # home-info mode
  homeInfoParams:
    Title: "Welcome to Non-Hype AI Topics (N-HAIT) blog!"
    Content: I am H. Fuat Alsan and I write about non-hype AI topics that usually fall outside the current trends.

  socialIcons:
    - name: github
      url: "https://github.com/fualsan"
    - name: linkedin
      url: "https://tr.linkedin.com/in/h-fuat-alsan-phd-0baa0b241"
    - name: googlescholar
      url: "https://scholar.google.com.tr/citations?user=BoShhsIAAAAJ&hl=en"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/fualsan/fualsan.github.io/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]


menu:
  main:
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: archives
      url: /archives/
      weight: 30
    - identifier: search
      name: search
      url: /search/
      weight: 40


# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
#pygmentsUseClasses: false
markup:
  goldmark:
    renderer:
      unsafe: true # for embedding HTML into markdown
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_Lines: ''
    hl_inline: false
    lineAnchors: ''
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
    #style: vim
    #style: monokai
    tabWidth: 4
    wrapperClass: highlight


outputs:
  home:
    - HTML
    - RSS
    - JSON # (search)

